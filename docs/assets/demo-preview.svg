<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Orange / Purple Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a33" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="620" fill="url(#bgGrad)" />

  <!-- Outer Browser Mockup Window -->
  <rect x="40" y="30" width="920" height="560" rx="16" fill="#0d131f" stroke="#253248" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Browser Titlebar -->
  <rect x="40" y="30" width="920" height="44" rx="16" fill="#131b2b" />
  <rect x="40" y="58" width="920" height="16" fill="#131b2b" />
  <circle cx="68" cy="52" r="6" fill="#ef4444" />
  <circle cx="88" cy="52" r="6" fill="#f59e0b" />
  <circle cx="108" cy="52" r="6" fill="#10b981" />
  <rect x="300" y="40" width="400" height="24" rx="6" fill="#1c263a" />
  <text x="500" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">https://hacktoberfest-copilot.app/analyze?repo=facebook/react</text>

  <!-- App Header / Hero inside Browser -->
  <g transform="translate(70, 95)">
    <!-- Logo Icon -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#accentGrad)" />
    <text x="20" y="27" font-size="22" text-anchor="middle">🎃</text>
    
    <text x="52" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold">Hacktoberfest Copilot</text>
    <text x="52" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">AI-Powered Open-Source Contribution Assistant</text>

    <!-- Search Input Bar -->
    <rect x="0" y="55" width="860" height="48" rx="10" fill="#172133" stroke="#2d3d57" stroke-width="1.5" />
    <text x="20" y="84" fill="#64748b" font-family="monospace" font-size="13">https://github.com/facebook/react</text>
    <rect x="710" y="60" width="142" height="38" rx="8" fill="url(#accentGrad)" />
    <text x="781" y="84" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Analyze Repo</text>
  </g>

  <!-- Two Column Layout: Repo Stats & Guidance Panel -->
  <g transform="translate(70, 220)">
    <!-- Left Column: Repo Summary Card -->
    <rect x="0" y="0" width="280" height="345" rx="12" fill="url(#cardGrad)" stroke="#27354d" stroke-width="1" />
    
    <text x="20" y="30" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold">📦 facebook / react</text>
    <rect x="20" y="44" width="85" height="20" rx="4" fill="#ff6a33" fill-opacity="0.2" />
    <text x="62" y="58" fill="#ff6a33" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">★ 224k Stars</text>

    <text x="20" y="85" fill="#94a3b8" font-family="sans-serif" font-size="12">Detected Tech Stack:</text>
    <rect x="20" y="95" width="75" height="22" rx="4" fill="#1e293b" />
    <text x="57" y="110" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">JavaScript</text>
    <rect x="102" y="95" width="60" height="22" rx="4" fill="#1e293b" />
    <text x="132" y="110" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="middle">C++</text>
    <rect x="169" y="95" width="60" height="22" rx="4" fill="#1e293b" />
    <text x="199" y="110" fill="#22c55e" font-family="monospace" font-size="11" text-anchor="middle">Flow</text>

    <text x="20" y="145" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">🎯 Recommended Issues:</text>

    <!-- Issue item 1 -->
    <rect x="15" y="160" width="250" height="75" rx="8" fill="#162032" stroke="#ff6a33" stroke-width="1.5" />
    <text x="25" y="180" fill="#ffedd5" font-family="sans-serif" font-size="11" font-weight="bold">#2841 Fix typo in docstrings</text>
    <rect x="25" y="190" width="80" height="18" rx="4" fill="#22c55e" fill-opacity="0.2" />
    <text x="65" y="203" fill="#22c55e" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BEGINNER</text>
    <text x="25" y="225" fill="#94a3b8" font-family="sans-serif" font-size="10">Skills: Markdown, Git, React</text>

    <!-- Issue item 2 -->
    <rect x="15" y="245" width="250" height="75" rx="8" fill="#131c2b" stroke="#253248" stroke-width="1" />
    <text x="25" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="bold">#2855 Add unit test for hooks</text>
    <rect x="25" y="275" width="95" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2" />
    <text x="72" y="288" fill="#60a5fa" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">INTERMEDIATE</text>
    <text x="25" y="310" fill="#94a3b8" font-family="sans-serif" font-size="10">Skills: Jest, React Core</text>

    <!-- Right Column: AI Guidance Hub Panel -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="560" height="345" rx="12" fill="url(#cardGrad)" stroke="#27354d" stroke-width="1" />

      <!-- Tabs Navigation Header -->
      <g transform="translate(15, 15)">
        <rect x="0" y="0" width="125" height="32" rx="6" fill="#1e293b" />
        <text x="62" y="21" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🧠 Understand</text>

        <rect x="135" y="0" width="135" height="32" rx="6" fill="#1e293b" />
        <text x="202" y="21" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🗺️ Plan</text>

        <rect x="280" y="0" width="135" height="32" rx="6" fill="url(#accentGrad)" />
        <text x="347" y="21" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🧪 Test Suggestions</text>

        <rect x="425" y="0" width="105" height="32" rx="6" fill="#1e293b" />
        <text x="477" y="21" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📝 PR Gen</text>
      </g>

      <!-- Panel Body Content -->
      <g transform="translate(20, 65)">
        <text x="0" y="20" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">Recommended Test Framework:</text>
        <rect x="235" y="5" width="100" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2" />
        <text x="285" y="20" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Jest + RTL</text>

        <text x="0" y="50" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="bold">Suggested Test Cases:</text>
        <text x="15" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">✓ Verify clean rendering without warnings</text>
        <text x="15" y="88" fill="#94a3b8" font-family="sans-serif" font-size="11">✓ Assert edge cases on empty parameters</text>
        <text x="15" y="106" fill="#94a3b8" font-family="sans-serif" font-size="11">✓ Validate hook state transitions on unmount</text>

        <!-- Code Block View -->
        <rect x="0" y="125" width="520" height="135" rx="8" fill="#090d14" stroke="#1f2c40" stroke-width="1" />
        <rect x="440" y="132" width="70" height="24" rx="4" fill="#1e293b" />
        <text x="475" y="148" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">📋 Copy</text>

        <text x="15" y="152" fill="#e2e8f0" font-family="monospace" font-size="11">describe('Documentation &amp; Component Tests', () =&gt; {</text>
        <text x="25" y="172" fill="#38bdf8" font-family="monospace" font-size="11">  test('renders without crashing', () =&gt; {</text>
        <text x="35" y="192" fill="#94a3b8" font-family="monospace" font-size="11">    const { getByText } = render(&lt;App /&gt;);</text>
        <text x="35" y="212" fill="#22c55e" font-family="monospace" font-size="11">    expect(getByText('Hacktoberfest')).toBeInTheDocument();</text>
        <text x="25" y="232" fill="#38bdf8" font-family="monospace" font-size="11">  });</text>
        <text x="15" y="250" fill="#e2e8f0" font-family="monospace" font-size="11">});</text>
      </g>
    </g>
  </g>
</svg>
