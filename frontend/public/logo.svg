<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2F" />
      <stop offset="100%" stop-color="#0F0F1A" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF4800" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#313244" stroke-width="2" />

  <!-- Pumpkin Stem -->
  <path d="M 60 26 C 60 20, 68 18, 70 16 C 67 22, 63 24, 60 26 Z" fill="#10B981" />

  <!-- Main Pumpkin Body / AI Nodes -->
  <ellipse cx="60" cy="62" rx="36" ry="30" fill="url(#orangeGrad)" filter="url(#glow)" />
  <ellipse cx="46" cy="62" rx="20" ry="29" fill="url(#orangeGrad)" opacity="0.8" />
  <ellipse cx="74" cy="62" rx="20" ry="29" fill="url(#orangeGrad)" opacity="0.8" />

  <!-- Carved Code Brackets & AI Core -->
  <!-- Left Bracket < -->
  <path d="M 44 48 L 34 60 L 44 72" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Bracket > -->
  <path d="M 76 48 L 86 60 L 76 72" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Slash / -->
  <path d="M 64 47 L 56 73" fill="none" stroke="#FFF7ED" stroke-width="3.5" stroke-linecap="round" />

  <!-- Glowing Copilot Sparkle Top Right -->
  <path d="M 94 22 Q 94 28 100 28 Q 94 28 94 34 Q 94 28 88 28 Q 94 28 94 22 Z" fill="url(#accentGrad)" />
</svg>
